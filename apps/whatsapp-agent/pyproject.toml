[project]
name = "laundrykhalaas-whatsapp-agent-standalone"
version = "0.1.0"
description = "Standalone LaundryKhalaas WhatsApp Agent - focused laundry/cleaning customer assistant, domain-guarded, mock-first."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.1",
    # Multipart form parsing — required by FastAPI for file uploads (facility
    # order photos: intake + pre-dispatch).
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "anthropic>=0.34.0",
    # S3-compatible client for Cloudflare R2 media storage (backend-only; the
    # dashboards never hold R2 credentials). Used by services/media_storage.py.
    "boto3>=1.34.0",
    # Reversible field-level encryption (Fernet) for sensitive facility bank
    # details. Used by services/field_encryption.py — the IBAN/account number are
    # stored ciphertext-only. Python's stdlib has no symmetric cipher.
    "cryptography>=42.0.0",
    # Stripe SDK (Invoicing + Tax). Used ONLY by services/payments/stripe_provider.py,
    # reached solely through services.payments.get_gateway() when STRIPE_MODE is
    # test/live with a key — mock mode (default) never imports it.
    "stripe>=15.4.0",
    # IANA timezone database (ZoneInfo) — required for market-timezone-aware
    # pickup scheduling on platforms without a system tz database (e.g. Windows).
    "tzdata>=2024.1",
    # Laundry Class agent (LangChain + LangGraph, mock-first)
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.4",
]
# Retrieval KB (Phase 2): local sentence embeddings for the redacted
# past-conversation index. fastembed pulls in onnxruntime (heavy), so it is an
# opt-in extra — services/chat_kb.py lazy-imports it and FAILS SOFT when absent
# (retrieval returns []). Enable in the indexing env and any deploy that should
# serve `search_past_conversations`:  pip install .[kb]
kb = [
    "fastembed>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "channels*", "llm*", "agents*", "api*", "laundry_class*", "db*"]
